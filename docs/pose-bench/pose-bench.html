<title>Pose Bench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: keyframe list on the left, a 3D figure you grab by the elbows and hands in the middle, numbers and notes under it. */
:root {
  --bg: #eceff2; --panel: #ffffff; --ink: #1b2229; --mute: #5b6a75; --line: #d2d8de;
  --hand: #d9570f; --elbow: #0a7f9c; --tip: #6a4cc2; --palm: #c2368f; --view: #dfe5ea; --danger: #c62828; --ok: #2e7d4f; --body: #9aa7b2;
  --display: "Space Grotesk", system-ui, sans-serif; --text: "Inter", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #13171b; --panel: #1b2126; --ink: #e5eaee; --mute: #94a2ad; --line: #2c353c;
  --hand: #ff8a4c; --elbow: #3cc4e4; --tip: #a58bff; --palm: #ff7ac6; --view: #0e1215; --danger: #ff6b6b; --ok: #6fd39a; --body: #55626d; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #13171b; --panel: #1b2126; --ink: #e5eaee; --mute: #94a2ad; --line: #2c353c;
  --hand: #ff8a4c; --elbow: #3cc4e4; --tip: #a58bff; --palm: #ff7ac6; --view: #0e1215; --danger: #ff6b6b; --ok: #6fd39a; --body: #55626d; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--text); margin: 0;
  padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font: 700 20px var(--display); margin: 0; letter-spacing: .01em; }
h2 { font: 700 13px var(--display); margin: 0 0 8px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.sub { color: var(--mute); }
.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .app { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; min-width: 0; }
#list { max-height: 80vh; overflow-y: auto; padding: 8px; position: sticky; top: 8px; }
@media (max-width: 820px) { #list { max-height: 220px; position: static; } }
.grp { font: 700 11px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); padding: 10px 6px 4px; }
.kf { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; background: none; border: 0; color: var(--ink);
  padding: 6px; border-radius: 4px; font: inherit; cursor: pointer; }
.kf:hover { background: color-mix(in srgb, var(--elbow) 10%, transparent); }
.kf[aria-current="true"] { background: color-mix(in srgb, var(--hand) 16%, transparent); font-weight: 600; }
.kf .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hand); flex: none; margin-top: 6px; visibility: hidden; }
.kf.edited .dot { visibility: visible; }
button, select, input, textarea { font: inherit; color: var(--ink); }
button.b { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; cursor: pointer; }
button.b:hover:not(:disabled) { border-color: var(--elbow); }
button.b:disabled { opacity: .5; cursor: default; }
button.b.pri { background: var(--hand); border-color: var(--hand); color: #fff; font-weight: 600; }
:root[data-theme="dark"] button.b.pri { color: #1a1008; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.b.pri { color: #1a1008; } }
button:focus-visible, input:focus-visible, textarea:focus-visible, canvas:focus-visible, select:focus-visible { outline: 2px solid var(--elbow); outline-offset: 2px; }
.bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.bar .sp { flex: 1; }
.stage { position: relative; background: var(--view); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
canvas { display: block; width: 100%; height: min(62vh, 560px); min-height: 320px; touch-action: none; cursor: grab; }
.legend { position: absolute; left: 10px; bottom: 8px; display: flex; gap: 12px; font: 12px var(--mono); color: var(--mute); pointer-events: none; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
.warn { position: absolute; right: 10px; top: 8px; font: 600 12px var(--text); color: var(--danger); background: var(--panel); border: 1px solid var(--danger); border-radius: 4px; padding: 3px 8px; }
.arms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
@media (max-width: 700px) { .arms { grid-template-columns: minmax(0, 1fr); } }
.arm h3 { margin: 0 0 6px; font: 700 14px var(--display); display: flex; justify-content: space-between; gap: 8px; }
.row { display: grid; grid-template-columns: 78px repeat(3, minmax(0, 1fr)); gap: 6px; align-items: center; margin-bottom: 6px; }
.row label { color: var(--mute); font-size: 12px; }
input[type=number] { width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.pos { font: 12px var(--mono); color: var(--mute); margin-top: 4px; font-variant-numeric: tabular-nums; }
.pos b { color: var(--ink); font-weight: 500; }
textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px; min-height: 56px; resize: vertical; }
.opts { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-top: 12px; }
.opts label { display: flex; gap: 6px; align-items: center; }
.opts output { font: 12px var(--mono); color: var(--mute); min-width: 38px; }
input[type=range] { accent-color: var(--hand); }
.status { color: var(--mute); font-size: 13px; }
.status.ok { color: var(--ok); }
.status.bad { color: var(--danger); }
#out { display: none; margin-top: 8px; font: 12px var(--mono); }
#out.on { display: block; }
.src { font: 12px var(--mono); color: var(--mute); overflow-wrap: anywhere; }
</style>

<header>
  <div>
    <h1>Pose Bench</h1>
    <div class="sub">Grab an elbow or a hand and put it where it belongs. Claude reads what you save.</div>
  </div>
  <div class="status" id="status" role="status">Loading…</div>
</header>

<div class="app">
  <nav class="panel" id="list" aria-label="Keyframes"></nav>

  <main class="panel">
    <div class="bar">
      <strong id="title" style="font:700 16px var(--display)"></strong>
      <span class="sp"></span>
      <button class="b" data-view="front">Front</button>
      <button class="b" data-view="right">Right</button>
      <button class="b" data-view="left">Left</button>
      <button class="b" data-view="back">Back</button>
      <button class="b" data-view="top">Top</button>
      <button class="b" data-view="three">3/4</button>
    </div>
    <div class="src" id="src"></div>
    <div class="stage" style="margin-top:8px">
      <canvas id="cv" tabindex="0" aria-label="Figure. Drag the blue elbows, orange wrists, purple fingertips and pink palm marks; drag empty space to turn the view; scroll to zoom."></canvas>
      <div class="legend"><span><i style="background:var(--elbow)"></i>elbow</span><span><i style="background:var(--hand)"></i>wrist</span><span><i style="background:var(--tip)"></i>fingers</span><span><i style="background:var(--palm)"></i>palm faces</span><span><i style="background:var(--body);opacity:.5"></i>before your edit</span></div>
      <div class="warn" id="warn" hidden>Arm through the body</div>
    </div>
    <div class="opts" id="playbar">
      <button class="b pri" id="play" type="button">Play</button>
      <button class="b" id="stop" type="button" disabled>Back to editing</button>
      <input type="range" id="scrub" min="0" max="3.9" step="0.01" value="0" aria-label="Position in the animation" disabled style="flex:1;min-width:120px">
      <label>Speed <select id="speed"><option value="0.25">¼×</option><option value="0.5">½×</option><option value="1" selected>1×</option></select></label>
      <label><input type="checkbox" id="ghostmo" checked> Show original motion</label>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="mirror"> Mirror edits to the other arm</label>
      <label>Coat thickness <input type="range" id="pad" min="1" max="1.6" step="0.05" value="1"></label>
      <label>Hand size <input type="range" id="hand" min="0.8" max="2.2" step="0.05" value="1.3"><output id="handv"></output></label>
      <label>Lean forward <input type="range" id="lean" min="-0.5" max="1.1" step="0.01" value="0"><output id="leanv"></output></label>
      <label>Hip height <input type="range" id="hip" min="0.35" max="0.95" step="0.01" value="0.89"><output id="hipv"></output></label>
      <button class="b" id="reset">Reset this keyframe</button>
    </div>
    <div class="arms" id="arms"></div>
    <div style="margin-top:12px">
      <h2>What is wrong with it</h2>
      <textarea id="note" aria-label="Note for this keyframe" placeholder="Optional. What should this look like?"></textarea>
    </div>
    <div class="opts">
      <button class="b pri" id="save">Save for Claude</button>
      <button class="b" id="copy">Copy edits as JSON</button>
      <span class="status" id="saved"></span>
    </div>
    <textarea id="out" readonly aria-label="Edits as JSON"></textarea>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

    arms: arms.map(p => {

    const shp = $(`shape-${i}`); if (shp && document.activeElement !== shp) shp.value = a.shape;
    ["u", "f", "d", "p"].forEach(kind => a[kind].forEach((v, j) => { const inp = $(`n-${i}-${kind}-${j}`); if (inp && document.activeElement !== inp) inp.value = r2(v); }));
    const el = $("pos-" + i); if (!el) return;
    const { e, w } = handPos(a);
    const f = v => v.map(x => (x * 100).toFixed(0).padStart(4)).join(" ");
    el.innerHTML = a.on ? `elbow <b>${f(e)}</b> cm<br>hand&nbsp; <b>${f(w)}</b> cm <span class="sub">(out, up, ahead of the chest line)</span>` : "At rest. Not part of this keyframe.";
  });
}
function changed(rebuild) {
  if (rebuild) buildArms(); else refreshNumbers();
  layout(); refreshList(); persistLocal(); $("saved").textContent = "";
}
$("note").addEventListener("input", e => { byId[sel].note = e.target.value; refreshList(); persistLocal(); });
$("reset").onclick = () => { const k = byId[sel]; k.cur = clone(k.orig); k.body = { ...k.obody }; k.note = ""; $("note").value = ""; syncBody(); changed(true); };
$("pad").addEventListener("input", e => { padK = +e.target.value; layout(); });
$("hand").addEventListener("input", e => { handS = +e.target.value; $("handv").textContent = "×" + handS.toFixed(2); persistLocal(); layout(); });
$("handv").textContent = "×" + handS.toFixed(2);
$("lean").addEventListener("input", e => { byId[sel].body.lean = +e.target.value; syncBody(); changed(); });
$("hip").addEventListener("input", e => { byId[sel].body.hip = +e.target.value; syncBody(); changed(); });
window.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea,select")) return;
  const i = ids.indexOf(sel);
  if (e.key === "ArrowDown" || e.key === "j") { select(ids[Math.min(ids.length - 1, i + 1)]); e.preventDefault(); }
  if (e.key === "ArrowUp" || e.key === "k") { select(ids[Math.max(0, i - 1)]); e.preventDefault(); }
});

// ---------- Playback
function syncPlayUI() {
  $("play").textContent = play.on && play.running ? "Pause" : "Play";
  $("stop").disabled = !play.on; $("scrub").disabled = !play.on;
  $("scrub").max = loopLen();
}
$("play").onclick = () => {
  if (!play.on) { play.on = true; play.running = true; play.T = 0; }
  else play.running = !play.running;
  syncPlayUI(); layout();
};
$("stop").onclick = () => { play.on = false; play.running = false; syncPlayUI(); layout(); };
$("scrub").addEventListener("input", e => { play.running = false; play.T = +e.target.value; syncPlayUI(); layout(); });
$("speed").onchange = e => { play.speed = +e.target.value; };
$("ghostmo").onchange = e => { play.ghost = e.target.checked; layout(); };

// ---------- Export / save
const fv = v => `F.V(${v.map(x => r2(x).toFixed(2)).join(", ")})`;
function exportOne(k) {
  const arms = {};
  k.cur.forEach((a, i) => {
    const o = k.orig[i], name = i ? "right_arm1" : "left_arm0";
    if (!a.on && !o.on) return;
    const e = { posed: a.on, upper_out_up_ahead: a.u.map(r2), fore_out_up_ahead: a.f.map(r2) };
    if (a.on) {
      const { e: el, w } = handPos(a);
      e.elbow_from_chest_m = el.map(r2); e.hand_from_chest_m = w.map(r2);
      e.pole_out_up_ahead = norm(el.map((v, j) => v - (a.sh[j] + w[j]) / 2)).map(r2);
      if (k.kind === "bones") e.code = `Bones(shoulder, ${fv(a.u)}, ${fv(a.f)}, upper, fore)`;
    }
    if (a.on) {
      e.hand = { shape: a.shape, fingers_out_up_ahead: a.d.map(r2), palm_faces_out_up_ahead: a.p.map(r2) };
      if (handDiff(a, o)) e.hand.was = { shape: o.shape, fingers_out_up_ahead: o.d.map(r2), palm_faces_out_up_ahead: o.p.map(r2) };
    }
    if (o.on) { e.was_upper = o.u.map(r2); e.was_fore = o.f.map(r2); e.was_hand_from_chest_m = handPos(o).w.map(r2); e.was_elbow_from_chest_m = handPos(o).e.map(r2); }
    arms[name] = e;
  });
  const out = { id: k.id, label: k.label, source: k.src, how: HOW[k.kind], note: k.note.trim(), arms };
  if (Math.abs(k.body.lean - k.obody.lean) > .005 || Math.abs(k.body.hip - k.obody.hip) > .005) out.body = { lean_forward_rad: r2(k.body.lean), hip_height_m: r2(k.body.hip), was_lean: r2(k.obody.lean), was_hip: r2(k.obody.hip) };
  return out;
}
const HOW = {
  bones: "Replace the Bones(shoulder, upper-arm direction, forearm direction, ...) numbers named in `code`.",
  target: "The game places the hand at a target and bends the elbow toward a pole (ArmGoal(hand, pole)). Move the named target or pole so the hand and elbow land where hand_from_chest_m and elbow_from_chest_m say.",
  hold: "A held weapon: the game places each hand on the weapon from the body each frame (HumanRig.Grips). Change the grip points so the hands land where hand_from_chest_m says; the elbow bends toward pole_out_up_ahead.",
};
const editedList = () => ids.map(i => byId[i]).filter(isEdited);
const doc = () => ({ hand_scale: handS, hand_note: "The game draws a hand as a small ball with no orientation. Hands here are 0.19 m long at scale 1 (an adult's), shown at hand_scale; every pose has fingers_out_up_ahead (the fingers' direction), palm_faces_out_up_ahead and a shape (open, fist, pointing). The starting values were guessed per pose and may have been corrected by the owner.", about: "Pose Bench edits. Unit vectors are [out, up, ahead] in the body's frame (out is toward the arm's own side); positions are metres from the chest line (the point between the shoulders) for a 1.72 m reference person: upper arm 0.303 m, forearm 0.284 m. Lean is forward tilt of the torso about the hips, in radians; hip height is above the feet.", keyframes: editedList().map(exportOne) });
function persistLocal() { try { localStorage.setItem("posebench3", JSON.stringify({ hand: handS, kfs: ids.map(i => [i, byId[i].cur, byId[i].note, byId[i].body]) })); } catch (e) {} }
function loadLocal() { try { const s = JSON.parse(localStorage.getItem("posebench3") || "null"); if (s) { handS = s.hand || handS; $("hand").value = handS; s.kfs.forEach(([i, cur, note, body]) => { const k = byId[i]; if (k && Array.isArray(cur) && cur.length === 2 && cur.every(a => a.sh && a.d)) { k.cur = cur; k.note = note || ""; if (body) k.body = body; } }); } } catch (e) {} }
/** Saved edits from before hands had an orientation get the starting hand. */
function withHands(k, arms) { return arms.map((a, i) => a.d ? a : { ...a, d: k.orig[i].d.slice(), p: k.orig[i].p.slice(), shape: k.orig[i].shape }); }

$("copy").onclick = async () => {
  const text = JSON.stringify(doc(), null, 2), out = $("out");
  out.value = text; out.classList.add("on");
  try { await navigator.clipboard.writeText(text); $("saved").textContent = "Copied."; } catch (e) { out.select(); $("saved").textContent = "Select and copy the text below."; }
};

let db = null;
$("save").onclick = async () => {
  const list = editedList();
  if (!db) { $("saved").textContent = "Saving needs a signed-in viewer. Use Copy edits as JSON instead."; $("saved").className = "status bad"; return; }
  try {
    for (const k of list) await db.collection("keyframes").doc(k.id).set({ label: k.label, savedAt: new Date().toISOString(), json: JSON.stringify(exportOne(k)), cur: JSON.stringify({ arms: k.cur, body: k.body, hand: handS }), note: k.note });
    $("saved").textContent = list.length ? `Saved ${list.length} keyframe${list.length > 1 ? "s" : ""}. Tell Claude when you're done.` : "Nothing edited yet."; $("saved").className = "status ok";
  } catch (e) { $("saved").textContent = "Save failed: " + (e.message || e.code); $("saved").className = "status bad"; }
};

// ---------- Boot
buildList(); loadLocal(); setTheme(); setCam(); select(sel); resize();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { setTheme(); layout(); });
new MutationObserver(() => { setTheme(); layout(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
$("status").textContent = "Drag a hand or an elbow";
(async () => {
  try {
    const c = window.claude && await window.claude.use("db"); if (!c) return;
    db = c;
    const snap = await db.collection("keyframes").get();
    snap.docs.forEach(d => {
      const v = d.data(), k = byId[d.id];
      if (!k || !v || !v.cur) return;
      try {
        const cur = JSON.parse(v.cur);
        if (cur && Array.isArray(cur.arms) && cur.arms.length === 2 && cur.arms.every(a => a.sh)) { k.cur = withHands(k, cur.arms); if (cur.body) k.body = cur.body; k.note = v.note || ""; }
      } catch (e) {}
    });
    select(sel);
    $("status").textContent = "Saved edits loaded";
  } catch (e) {}
})();
</script>
